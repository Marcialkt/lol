<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxy Clicker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

:root {
  --bg: #07071a;
  --card: #0e0e2e;
  --border: #1c1c4a;
  --blue: #4f8ef7;
  --purple: #a259ff;
  --gold: #ffd700;
  --green: #00e676;
  --text: #dde4ff;
  --dim: #5a6690;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOP BAR ── */
#topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  gap: 8px;
}
.stat { text-align: center; flex: 1; }
.stat-val { font-size: 18px; font-weight: 800; color: var(--gold); line-height: 1; }
.stat-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
.stat-sub { font-size: 11px; color: var(--green); margin-top: 1px; }

/* ── CLICK ZONE ── */
#click-zone {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px 12px;
  gap: 10px;
  background: radial-gradient(ellipse at 50% 0%, rgba(79,142,247,.08) 0%, transparent 70%);
}

#orb-wrap {
  position: relative;
  width: 160px;
  height: 160px;
  cursor: pointer;
  touch-action: manipulation;
}

#orb {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%,
    #8ab8ff 0%, #2a6af0 30%, #0d2a80 65%, #060d30 100%);
  box-shadow:
    0 0 30px rgba(79,142,247,.5),
    0 0 70px rgba(79,142,247,.2),
    inset 0 -10px 30px rgba(0,0,30,.6),
    inset 5px 5px 20px rgba(255,255,255,.08);
  transition: transform .07s, box-shadow .07s;
  will-change: transform;
}
#orb.tap {
  transform: scale(.91);
  box-shadow:
    0 0 50px rgba(79,142,247,.9),
    0 0 100px rgba(79,142,247,.4),
    inset 0 -10px 30px rgba(0,0,30,.6);
}

/* Rotating ring */
#ring1 {
  position: absolute; inset: -12px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: rgba(79,142,247,.6);
  border-right-color: rgba(79,142,247,.2);
  animation: spin 4s linear infinite;
  pointer-events: none;
}
#ring2 {
  position: absolute; inset: -22px;
  border-radius: 50%;
  border: 1px solid transparent;
  border-bottom-color: rgba(162,89,255,.5);
  border-left-color: rgba(162,89,255,.15);
  animation: spin 9s linear infinite reverse;
  pointer-events: none;
}
#ring3 {
  position: absolute; inset: -34px;
  border-radius: 50%;
  border: 1px dashed rgba(255,215,0,.1);
  animation: spin 18s linear infinite;
  pointer-events: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

#click-hint { font-size: 12px; color: var(--dim); letter-spacing: .3px; }
#click-hint span { color: var(--blue); font-weight: 600; }

/* ── UPGRADES SECTION ── */
#upgrades-section {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 10px 16px;
  scrollbar-width: none;
}
#upgrades-section::-webkit-scrollbar { display: none; }

#upgrades-header {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 8px 4px 6px;
  font-size: 10px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 6px;
}
#upgrades-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* upgrade card */
.upg-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color .2s, background .2s, transform .1s;
  animation: slideIn .3s ease-out;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.upg-card.can-buy {
  border-color: rgba(79,142,247,.45);
  background: rgba(79,142,247,.05);
}
.upg-card.can-buy:active { transform: scale(.97); }
.upg-card.bought {
  opacity: .45;
  border-color: rgba(0,230,118,.2);
  background: rgba(0,230,118,.03);
}
.upg-icon { font-size: 30px; flex-shrink: 0; line-height: 1; }
.upg-body { flex: 1; min-width: 0; }
.upg-name { font-size: 14px; font-weight: 700; }
.upg-desc { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
.upg-right { text-align: right; flex-shrink: 0; }
.upg-cost {
  font-size: 14px;
  font-weight: 800;
  color: var(--gold);
}
.upg-cost.afford { color: var(--green); }
.upg-cost.bought-label { color: var(--green); font-size: 18px; }
.upg-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.upg-bar { height: 100%; background: linear-gradient(90deg, var(--blue), var(--purple)); border-radius: 2px; transition: width .4s; }
.upg-type-badge {
  display: inline-block;
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-top: 4px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.badge-click  { background: rgba(79,142,247,.2);  color: var(--blue); }
.badge-auto   { background: rgba(0,230,118,.15);  color: var(--green); }
.badge-multi  { background: rgba(255,215,0,.15);  color: var(--gold); }
.badge-crit   { background: rgba(255,82,82,.2);   color: #ff8080; }
.badge-special{ background: rgba(162,89,255,.2);  color: var(--purple); }

/* ── EFFECTS ── */
.float {
  position: fixed;
  font-weight: 800;
  pointer-events: none;
  z-index: 9999;
  animation: floatUp .9s ease-out forwards;
}
@keyframes floatUp {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-70px) scale(.65); }
}
.particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  animation: pOut .7s ease-out forwards;
}
@keyframes pOut {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(0); }
}
.ripple {
  position: fixed;
  border-radius: 50%;
  border: 2px solid rgba(79,142,247,.7);
  pointer-events: none;
  z-index: 9997;
  transform: translate(-50%,-50%);
  animation: rippleOut .55s ease-out forwards;
}
@keyframes rippleOut {
  0%   { width:10px; height:10px; opacity:.8; }
  100% { width:110px; height:110px; opacity:0; }
}

/* unlock flash */
.unlock-flash {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle, rgba(79,142,247,.15), transparent 60%);
  pointer-events: none;
  z-index: 9996;
  animation: flashOut .5s ease-out forwards;
}
@keyframes flashOut { to { opacity: 0; } }

/* toast */
#toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: rgba(14,14,46,.95);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 13px;
  z-index: 9995;
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
#toast.show { opacity: 1; }

/* milestone pill */
#milestone {
  position: fixed;
  top: 70px; left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: linear-gradient(135deg, rgba(255,215,0,.2), rgba(255,165,0,.1));
  border: 1px solid rgba(255,215,0,.4);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--gold);
  z-index: 9994;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  pointer-events: none;
}
#milestone.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* stars */
#stars-bg {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.sd {
  position: absolute; background: #fff; border-radius: 50%;
  animation: tw var(--d) ease-in-out infinite var(--delay);
}
@keyframes tw { 0%,100%{opacity:var(--o)} 50%{opacity:.05} }

/* scrollable area sits above stars */
body > * { position: relative; z-index: 1; }
</style>
</head>
<body>

<div id="stars-bg"></div>
<div id="toast"></div>
<div id="milestone"></div>

<!-- TOP BAR -->
<div id="topbar">
  <div class="stat">
    <div class="stat-val" id="money">0</div>
    <div class="stat-label">Energía</div>

  </div>
  <div class="stat">
    <div class="stat-val" id="click-power-display">1</div>
    <div class="stat-label">Por click</div>
  </div>

    <div class="stat-val" id="bought-count">0</div>

</div>

<!-- CLICK ZONE -->
<div id="click-zone">

    <div id="ring3"></div>

    <div id="ring1"></div>
    <div id="orb"></div>

  { id:'c6',   icon:'⚡', name:'Rayo Cuántico',          desc:'+50 energía por click',     cost:20000,  type:'click',   apply:()=>{ clickPow+=50; } },
  { id:'a6',   icon:'🌋', name:'Planta Geotérmica',      desc:'+120 energía / segundo',   cost:30000,  type:'auto',    apply:()=>{ autoPerSec+=120; } },

  { id:'m4',   icon:'🚀', name:'Motor de Fusión',        desc:'x8 toda la producción',     cost:500000, type:'multi',   apply:()=>{ clickPow*=8; autoPerSec*=8; } },

  { id:'c13',  icon:'🖖', name:'Toque del Creador',      desc:'x10 poder de click',        cost:2e9,    type:'click',   apply:()=>{ clickPow*=10; } },
  { id:'m9',   icon:'♾️', name:'Bucle Infinito',         desc:'x100 toda la producción',   cost:5e9,    type:'multi',   apply:()=>{ clickPow*=100; autoPerSec*=100; } },
  { id:'sp4',  icon:'🌐', name:'IA Cuántica',            desc:'+500 clicks automáticos/s', cost:8e9,    type:'special', apply:()=>{ autoPerSec+=clickPow*500; } },

// ─────────────────────────────────────────
//  FORMAT NUMBERS
// ─────────────────────────────────────────
function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const tiers = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  let i = 0;
  while (n >= 1000 && i < tiers.length - 1) { n /= 1000; i++; }
  return n.toFixed(2) + tiers[i];
}

// ─────────────────────────────────────────
//  CLICK
// ─────────────────────────────────────────
function tap(e) {
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const x = touch ? touch.clientX : e.clientX || window.innerWidth / 2;
  const y = touch ? touch.clientY : e.clientY || window.innerHeight / 2;

  let gain = clickPow;
  let isCrit = critChance > 0 && Math.random() < critChance;
  if (isCrit) gain = Math.floor(gain * critMulti);

  money        += gain;
  totalEarned  += gain;

  // Effects
  spawnFloat(x, y, '+' + fmt(gain), isCrit);
  spawnParticles(x, y, isCrit);
  spawnRipple(x, y);
  pulsOrb();
}

function pulsOrb() {
  const o = document.getElementById('orb');
  o.classList.add('tap');
  setTimeout(() => o.classList.remove('tap'), 90);
}

function spawnFloat(x, y, text, crit) {
  const el = document.createElement('div');
  el.className = 'float';
  const size   = crit ? '22px' : '16px';
  const color  = crit ? '#ffd700' : '#7ab8ff';
  const shadow = crit ? '0 0 10px #ffd700' : '0 0 6px #4f8ef7';
  el.style.cssText = `
    left:${x - 15 + (Math.random() * 30 - 15)}px;
    top:${y - 10}px;
    font-size:${size};
    color:${color};
    text-shadow:${shadow};
  `;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function spawnParticles(x, y, crit) {
  const colors = crit
    ? ['#ffd700','#ffaa00','#ff8800','#fff']
    : ['#4f8ef7','#a259ff','#00e5ff','#dde4ff'];
  const count = crit ? 10 : 5;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    const sz = 4 + Math.random() * 4;
    const ang = (Math.PI * 2 / count) * i + Math.random() * .6;
    const dist = 25 + Math.random() * 45;
    el.style.cssText = `
      left:${x - sz/2}px; top:${y - sz/2}px;
      width:${sz}px; height:${sz}px;
      background:${colors[i % colors.length]};
      --dx:${Math.cos(ang)*dist}px;
      --dy:${Math.sin(ang)*dist}px;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 750);
  }
}

function spawnRipple(x, y) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 580);
}

// ─────────────────────────────────────────
//  UPGRADE SYSTEM
// ─────────────────────────────────────────
function buyUpgrade(id) {
  const u = UPGRADES.find(u => u.id === id);
  if (!u || purchased[id] || money < u.cost) return;
  money -= u.cost;
  purchased[id] = true;
  boughtCount++;
  u.apply();
  renderUpgrades();
  updateUI();
  toast(`${u.icon} ${u.name} — activado!`);
}

// Which upgrades are visible:
// - Not bought yet AND totalEarned >= cost/15  (appears well before you can buy)
// - OR already bought
function visibleUpgrades() {
  return UPGRADES.filter(u => purchased[u.id] || totalEarned >= u.cost / 15);
}

let lastVisibleCount = 0;

function renderUpgrades() {
  const list  = document.getElementById('upgrades-list');
  const end   = document.getElementById('end-msg');
  const items = visibleUpgrades();

  // New unlock?
  if (items.length > lastVisibleCount) {
    if (lastVisibleCount > 0) {
      flashUnlock();
      toast('🔓 ¡Nueva mejora desbloqueada!');
    }
    lastVisibleCount = items.length;
  }

  list.innerHTML = '';

  if (items.length === 0) {
    const hint = document.createElement('div');
    hint.style.cssText = 'text-align:center;padding:30px;font-size:13px;color:var(--dim)';
    hint.textContent = '¡Sigue clickeando para desbloquear mejoras!';
    list.appendChild(hint);
    return;
  }

  // Show pending first, then bought
  const pending = items.filter(u => !purchased[u.id]);
  const done    = items.filter(u =>  purchased[u.id]);

  for (const u of [...pending, ...done]) {
    const card     = document.createElement('div');
    const isBought = !!purchased[u.id];
    const canBuy   = !isBought && money >= u.cost;
    card.className = 'upg-card' + (isBought ? ' bought' : canBuy ? ' can-buy' : '');

    const pct = isBought ? 100 : Math.min(100, (money / u.cost) * 100);
    const badge = { click:'badge-click', auto:'badge-auto', multi:'badge-multi', crit:'badge-crit', special:'badge-special' }[u.type];
    const typeLabel = { click:'Click', auto:'Auto', multi:'Multiplicador', crit:'Crítico', special:'Especial' }[u.type];

    card.innerHTML = `
      <div class="upg-icon">${u.icon}</div>
      <div class="upg-body">
        <div class="upg-name">${u.name}</div>
        <div class="upg-desc">${u.desc}</div>
        <span class="upg-type-badge ${badge}">${typeLabel}</span>
        ${!isBought ? `<div class="upg-bar-wrap"><div class="upg-bar" style="width:${pct}%"></div></div>` : ''}
      </div>
      <div class="upg-right">
        ${isBought
          ? '<div class="upg-cost bought-label">✓</div>'
          : `<div class="upg-cost ${canBuy?'afford':''}">💰${fmt(u.cost)}</div>`
        }
      </div>
    `;

    if (canBuy) card.onclick = () => buyUpgrade(u.id);
    list.appendChild(card);
  }

  // End message
  const allBought = UPGRADES.every(u => purchased[u.id]);
  end.style.display = allBought ? 'block' : 'none';
}

function flashUnlock() {
  const el = document.createElement('div');
  el.className = 'unlock-flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 550);
}

// ─────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────
let toastTmr;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─────────────────────────────────────────
//  UI UPDATE
// ─────────────────────────────────────────
function updateUI() {
  document.getElementById('money').textContent = fmt(money);
  document.getElementById('per-sec').textContent = '+' + fmt(autoPerSec) + '/s';
  document.getElementById('click-power-display').textContent = fmt(clickPow);
  document.getElementById('hint-val').textContent = fmt(clickPow);
  document.getElementById('bought-count').textContent = boughtCount;
}

// ─────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────
let lastTick = Date.now();

function loop() {
  const now = Date.now();
  const dt  = Math.min((now - lastTick) / 1000, 0.5);
  lastTick  = now;

  if (autoPerSec > 0) {
    const gain = autoPerSec * dt;
    money       += gain;
    totalEarned += gain;
  }

  updateUI();
  renderUpgrades();
  requestAnimationFrame(loop);
}

// ─────────────────────────────────────────
//  SAVE / LOAD
// ─────────────────────────────────────────
function save() {
  localStorage.setItem('gc_save2', JSON.stringify({
    money, totalEarned, clickPow, autoPerSec,
    critChance, critMulti, boughtCount,
    purchased: Object.keys(purchased),
  }));
}

function load() {
  try {
    const raw = localStorage.getItem('gc_save2');
    if (!raw) return;
    const s = JSON.parse(raw);
    money       = s.money       || 0;
    totalEarned = s.totalEarned || 0;
    clickPow    = s.clickPow    || 1;
    autoPerSec  = s.autoPerSec  || 0;
    critChance  = s.critChance  || 0;
    critMulti   = s.critMulti   || 2;
    boughtCount = s.boughtCount || 0;
    (s.purchased || []).forEach(id => { purchased[id] = true; });
    // Re-mark last visible count so we don't flash on load
    lastVisibleCount = visibleUpgrades().length;
  } catch(e) {}
}

// ─────────────────────────────────────────
//  STARS BACKGROUND
// ─────────────────────────────────────────
function buildStars() {
  const bg = document.getElementById('stars-bg');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'sd';
    const sz = (Math.random() * 2 + 1).toFixed(1);
    const o  = (Math.random() * .5 + .1).toFixed(2);
    const d  = (Math.random() * 3 + 2).toFixed(1) + 's';
    const dl = (Math.random() * 4).toFixed(1) + 's';
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--o:${o};--d:${d};--delay:${dl};`;
    bg.appendChild(s);
  }
}

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
buildStars();
load();
updateUI();
renderUpgrades();
setInterval(save, 20000);
loop();
</script>
</body>
</html>
