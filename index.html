<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxy Clicker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#04040f;--card:#0b0b20;--card2:#0f0f28;
  --b1:#14143a;--b2:#1e1e50;
  --blue:#5ba3ff;--purple:#b06fff;--gold:#ffd966;
  --green:#3fffa0;--red:#ff6b6b;--cyan:#3ff0ff;
  --text:#dde6ff;--dim:#525a80;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── STARS BG ── */
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sd{position:absolute;background:#fff;border-radius:50%;animation:tw var(--d) ease-in-out infinite var(--dl)}
@keyframes tw{0%,100%{opacity:var(--o)}50%{opacity:.03}}
body>*:not(#bg){position:relative;z-index:1}

/* ── TOP BAR ── */
#bar{
  background:rgba(11,11,32,.97);border-bottom:1px solid var(--b1);
  padding:8px 14px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;gap:6px;
}
.stat{text-align:center;flex:1}
.stat-v{font-size:16px;font-weight:900;line-height:1;letter-spacing:-.3px}
.stat-v.gold{color:var(--gold)}
.stat-v.blue{color:var(--blue)}
.stat-v.green{color:var(--green)}
.stat-l{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.stat-sep{width:1px;background:var(--b1);height:28px;flex-shrink:0}

/* ── CLICK ZONE ── */
#czone{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  padding:18px 0 14px;gap:12px;
  background:radial-gradient(ellipse at 50% 0%,rgba(91,163,255,.07) 0%,transparent 65%);
}
#owrap{position:relative;width:148px;height:148px;cursor:pointer;touch-action:manipulation}

/* orb */
#orb{
  width:100%;height:100%;border-radius:50%;
  background:
    radial-gradient(circle at 36% 28%,rgba(200,230,255,.55) 0%,transparent 38%),
    radial-gradient(circle at 50% 50%,#1854c8 0%,#0d2560 48%,#050b22 100%);
  box-shadow:0 0 0 1px rgba(91,163,255,.35),0 0 28px rgba(91,163,255,.45),0 0 70px rgba(91,163,255,.15),
    inset 0 0 28px rgba(0,0,30,.55),inset 4px 4px 16px rgba(255,255,255,.07);
  transition:transform .08s,box-shadow .08s;will-change:transform
}
#orb.tap{
  transform:scale(.87);
  box-shadow:0 0 0 3px rgba(91,163,255,.7),0 0 50px rgba(91,163,255,.85),0 0 100px rgba(91,163,255,.35),
    inset 0 0 28px rgba(0,0,30,.55)
}
/* atmosphere halo */
#orb::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  background:radial-gradient(circle,transparent 48%,rgba(91,163,255,.12) 72%,transparent 80%);
  animation:atmo 3s ease-in-out infinite alternate
}
@keyframes atmo{to{opacity:.5}}

/* rings */
.rng{position:absolute;border-radius:50%;border:1px solid transparent;pointer-events:none}
#r1{inset:-11px;border-top-color:rgba(91,163,255,.75);border-right-color:rgba(91,163,255,.25);animation:spin 3.5s linear infinite}
#r2{inset:-21px;border-bottom-color:rgba(176,111,255,.55);border-left-color:rgba(176,111,255,.15);animation:spin 8s linear infinite reverse}
#r3{inset:-33px;border:1px dashed rgba(255,215,102,.12);animation:spin 22s linear infinite}
#r4{inset:-46px;border-top-color:rgba(63,255,160,.15);animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
/* orbiting dots */
#r1::before{content:'';position:absolute;width:7px;height:7px;background:var(--blue);border-radius:50%;
  top:50%;left:-4px;transform:translateY(-50%);box-shadow:0 0 8px var(--blue),0 0 16px var(--blue)}
#r2::after{content:'';position:absolute;width:5px;height:5px;background:var(--purple);border-radius:50%;
  top:0;left:50%;transform:translateX(-50%);box-shadow:0 0 7px var(--purple)}
#r3::before{content:'';position:absolute;width:4px;height:4px;background:var(--gold);border-radius:50%;
  bottom:0;left:50%;transform:translateX(-50%);box-shadow:0 0 6px var(--gold)}

#cpow{font-size:12px;color:var(--dim);letter-spacing:.2px}
#cpow b{color:var(--blue);font-weight:800}

/* ── UPGRADES SECTION ── */
#usec{flex:1;overflow:hidden;display:flex;flex-direction:column;border-top:1px solid var(--b1)}

#uhead{
  display:flex;align-items:center;gap:8px;padding:7px 14px 6px;
  background:rgba(11,11,32,.8);flex-shrink:0
}
#utitle{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
#ucnt{font-size:10px;color:var(--blue);background:rgba(91,163,255,.12);border-radius:20px;padding:1px 8px}
#uline{flex:1;height:1px;background:var(--b1)}

#uscroll{flex:1;overflow-y:auto;padding:8px 10px 24px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#uscroll::-webkit-scrollbar{display:none}

/* ── UPGRADE CARD ── */
.ucard{
  border-radius:16px;margin-bottom:8px;padding:12px 13px 10px;
  display:flex;align-items:flex-start;gap:11px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .12s,border-color .2s,box-shadow .2s;
  animation:slideUp .28s ease-out both
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.ucard:active{transform:scale(.965)}

/* type themes */
.tc{background:linear-gradient(135deg,rgba(91,163,255,.1),rgba(91,163,255,.04));border:1px solid rgba(91,163,255,.2)}
.ta{background:linear-gradient(135deg,rgba(63,255,160,.09),rgba(63,255,160,.03));border:1px solid rgba(63,255,160,.18)}
.tm{background:linear-gradient(135deg,rgba(255,217,102,.1),rgba(255,217,102,.03));border:1px solid rgba(255,217,102,.2)}
.tr{background:linear-gradient(135deg,rgba(255,107,107,.09),rgba(255,107,107,.03));border:1px solid rgba(255,107,107,.18)}
.ts{background:linear-gradient(135deg,rgba(176,111,255,.1),rgba(176,111,255,.03));border:1px solid rgba(176,111,255,.2)}

/* glow when affordable */
.ucard.buy.tc{border-color:rgba(91,163,255,.75);box-shadow:0 0 14px rgba(91,163,255,.28),inset 0 0 20px rgba(91,163,255,.06)}
.ucard.buy.ta{border-color:rgba(63,255,160,.7);box-shadow:0 0 14px rgba(63,255,160,.22),inset 0 0 20px rgba(63,255,160,.05)}
.ucard.buy.tm{border-color:rgba(255,217,102,.75);box-shadow:0 0 14px rgba(255,217,102,.28),inset 0 0 20px rgba(255,217,102,.06)}
.ucard.buy.tr{border-color:rgba(255,107,107,.7);box-shadow:0 0 14px rgba(255,107,107,.22),inset 0 0 20px rgba(255,107,107,.05)}
.ucard.buy.ts{border-color:rgba(176,111,255,.75);box-shadow:0 0 14px rgba(176,111,255,.25),inset 0 0 20px rgba(176,111,255,.06)}

.ucard.done{opacity:.32;filter:grayscale(.5);cursor:default;pointer-events:none}

/* shimmer on new affordable card */
.ucard.buy::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.04) 50%,transparent 70%);
  animation:shim 2.5s ease-in-out infinite
}
@keyframes shim{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}

/* NEW badge */
.nbadge{
  position:absolute;top:8px;right:8px;
  background:var(--green);color:#000;font-size:8px;font-weight:900;
  padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;
  animation:np 1.1s ease-in-out infinite
}
@keyframes np{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(.92)}}

/* icon wrapper — colored circle */
.uico{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  margin-top:1px
}
.tc .uico{background:rgba(91,163,255,.15)}
.ta .uico{background:rgba(63,255,160,.13)}
.tm .uico{background:rgba(255,217,102,.13)}
.tr .uico{background:rgba(255,107,107,.13)}
.ts .uico{background:rgba(176,111,255,.15)}

.ubody{flex:1;min-width:0}
.uname{font-size:13px;font-weight:800;line-height:1.2;letter-spacing:-.1px}
.udesc{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}

/* type badge pill */
.upill{
  display:inline-block;font-size:8px;font-weight:800;
  padding:2px 7px;border-radius:20px;margin-top:5px;
  text-transform:uppercase;letter-spacing:.4px
}
.tc .upill{background:rgba(91,163,255,.18);color:#8ac4ff}
.ta .upill{background:rgba(63,255,160,.14);color:#6fffb8}
.tm .upill{background:rgba(255,217,102,.16);color:#ffd966}
.tr .upill{background:rgba(255,107,107,.16);color:#ff9090}
.ts .upill{background:rgba(176,111,255,.18);color:#cc99ff}

/* progress + cost row */
.ubot{display:flex;align-items:center;gap:9px;margin-top:8px}
.ubar{flex:1;height:4px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.ubfill{height:100%;border-radius:3px;transition:width .5s ease}
.tc .ubfill{background:linear-gradient(90deg,#1e5acc,var(--blue))}
.ta .ubfill{background:linear-gradient(90deg,#00995c,var(--green))}
.tm .ubfill{background:linear-gradient(90deg,#cc8800,var(--gold))}
.tr .ubfill{background:linear-gradient(90deg,#cc3333,var(--red))}
.ts .ubfill{background:linear-gradient(90deg,#7733cc,var(--purple))}

.ucost{font-size:12px;font-weight:800;flex-shrink:0;white-space:nowrap;transition:color .2s}
.cost-no{color:var(--dim)}
.cost-ok{color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.4)}
.cost-v{color:var(--green);font-size:17px}

/* buy button (visible only when affordable) */
.ubtn{
  display:none;
  background:var(--blue);border:none;border-radius:8px;
  color:#000;font-size:10px;font-weight:900;padding:4px 10px;
  cursor:pointer;flex-shrink:0;letter-spacing:.3px;text-transform:uppercase
}
.ucard.buy .ubtn{display:block}
.ta.buy .ubtn{background:var(--green)}
.tm.buy .ubtn{background:var(--gold)}
.tr.buy .ubtn{background:var(--red)}
.ts.buy .ubtn{background:var(--purple);color:#fff}

#emptyhint{
  text-align:center;padding:36px 24px;font-size:12px;color:var(--dim);line-height:1.8;display:none
}

/* ── EFFECTS ── */
.flt{position:fixed;font-weight:900;pointer-events:none;z-index:9999;animation:fUp .9s ease-out forwards}
@keyframes fUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-68px) scale(.55)}}
.ptc{position:fixed;border-radius:50%;pointer-events:none;z-index:9998;animation:pOut .72s ease-out forwards}
@keyframes pOut{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.rpl{
  position:fixed;border-radius:50%;pointer-events:none;z-index:9997;
  transform:translate(-50%,-50%);border:2px solid rgba(91,163,255,.65);
  animation:rOut .52s ease-out forwards
}
@keyframes rOut{from{width:8px;height:8px;opacity:.9}to{width:100px;height:100px;opacity:0}}

/* purchase flash */
.pfx{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:10000;
  font-size:15px;font-weight:900;padding:12px 22px;border-radius:14px;
  animation:pfxA .5s ease-out forwards
}
@keyframes pfxA{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(.95)}
}
/* TOAST */
#toast{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(11,11,32,.97);border:1px solid rgba(91,163,255,.25);
  border-radius:10px;padding:8px 18px;font-size:12px;z-index:9995;
  opacity:0;transition:opacity .25s;pointer-events:none;
  white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis
}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="bg"></div>
<div id="toast"></div>

<!-- TOP BAR -->
<div id="bar">
  <div class="stat">
    <div class="stat-v gold" id="bmoney">0</div>
    <div class="stat-l">💰 Energía</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <div class="stat-v blue" id="bclick">1</div>
    <div class="stat-l">⚡ / Clic</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <div class="stat-v green" id="bauto">0</div>
    <div class="stat-l">🔄 / Seg</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <div class="stat-v" style="color:var(--purple)" id="bbought">0/50</div>
    <div class="stat-l">🏆 Mejoras</div>
  </div>
</div>

<!-- CLICK ZONE -->
<div id="czone">
  <div id="owrap">
    <div class="rng" id="r4"></div>
    <div class="rng" id="r3"></div>
    <div class="rng" id="r2"></div>
    <div class="rng" id="r1"></div>
    <div id="orb"></div>
  </div>
  <div id="cpow">Toca · <b id="cpval">1</b> energía / clic</div>
</div>

<!-- UPGRADES -->
<div id="usec">
  <div id="uhead">
    <div id="utitle">⚡ Mejoras</div>
    <div id="ucnt">0 / 50</div>
    <div id="uline"></div>
  </div>
  <div id="uscroll">
    <div id="ulist"></div>
    <div id="emptyhint">¡Toca el planeta para empezar!<br><small>Las mejoras van apareciendo conforme ganas energía.</small></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let money=0, total=0, cpow=1, aps=0, crit=0, cmul=2, bought=0;
const P={}; // purchased ids
const NEW={}; // newly unlocked ids
const knownVis=new Set(); // ids ever shown

// ══════════════════════════════════════════
//  UPGRADES  (50 mejoras)
// ══════════════════════════════════════════
// t = click | auto | multi | crit | special
const UPS=[
  // ─ Tier 1 ─────────────────────────────
  {id:'c1', icon:'👆',name:'Clic Básico',        desc:'+1 energía por clic',              cost:10,    t:'click', fn:()=>cpow+=1},
  {id:'a1', icon:'⚙️',name:'Panel Solar',         desc:'+1 energía/segundo automático',    cost:25,    t:'auto',  fn:()=>aps+=1},

  {id:'a2', icon:'🌬️',name:'Turbina de Viento',    desc:'+3 energía/segundo',               cost:150,   t:'auto',  fn:()=>aps+=3},
  {id:'c3', icon:'💪',name:'Clic Potenciado',      desc:'+5 energía por clic',              cost:290,   t:'click', fn:()=>cpow+=5},
  {id:'cr1',icon:'🎯',name:'Golpe Preciso',        desc:'+8% crítico · daño ×2',            cost:500,   t:'crit',  fn:()=>crit+=.08},
  {id:'a3', icon:'☀️',name:'Granja Solar',         desc:'+8 energía/segundo',               cost:680,   t:'auto',  fn:()=>aps+=8},
  // ─ Tier 2 ─────────────────────────────
  {id:'m1', icon:'⚡',name:'Acelerador',           desc:'×2 clic y producción automática',  cost:1000,  t:'multi', fn:()=>{cpow*=2;aps*=2}},
  {id:'c4', icon:'🤜',name:'Puñetazo Cósmico',     desc:'+15 energía por clic',             cost:1500,  t:'click', fn:()=>cpow+=15},
  {id:'a4', icon:'⚛️',name:'Reactor Nuclear',      desc:'+20 energía/segundo',              cost:2500,  t:'auto',  fn:()=>aps+=20},
  {id:'c5', icon:'🖐️',name:'Cinco Dedos',          desc:'×2.5 poder de clic',               cost:3900,  t:'click', fn:()=>cpow=Math.floor(cpow*2.5)},
  {id:'cr2',icon:'💢',name:'Crítico Mejorado',     desc:'Críticos ×3 · +5% crítico',        cost:5000,  t:'crit',  fn:()=>{cmul=3;crit+=.05}},
  {id:'a5', icon:'🌊',name:'Generador de Mareas',  desc:'+50 energía/segundo',              cost:6800,  t:'auto',  fn:()=>aps+=50},
  {id:'m2', icon:'🔥',name:'Hipercombustión',      desc:'×3 clic y producción automática',  cost:9800,  t:'multi', fn:()=>{cpow*=3;aps*=3}},
  // ─ Tier 3 ─────────────────────────────
  {id:'c6', icon:'⚡',name:'Rayo Cuántico',        desc:'+50 energía por clic',             cost:19000, t:'click', fn:()=>cpow+=50},
  {id:'a6', icon:'🌋',name:'Planta Geotérmica',    desc:'+120 energía/segundo',             cost:29000, t:'auto',  fn:()=>aps+=120},
  {id:'cr3',icon:'🎆',name:'Supernova Crítica',    desc:'+15% probabilidad crítico',        cost:39000, t:'crit',  fn:()=>crit+=.15},
  {id:'c7', icon:'🌀',name:'Espiral de Energía',   desc:'×3 poder de clic',                 cost:57000, t:'click', fn:()=>cpow*=3},
  {id:'a7', icon:'🔮',name:'Cristal Energético',   desc:'+300 energía/segundo',             cost:78000, t:'auto',  fn:()=>aps+=300},
  {id:'m3', icon:'💫',name:'Catalizador Estelar',  desc:'×5 clic y producción automática',  cost:115000,t:'multi', fn:()=>{cpow*=5;aps*=5}},
  {id:'sp1',icon:'🤖',name:'Auto-Clicker',         desc:'Auto-genera clic×2 por segundo',   cost:145000,t:'special',fn:()=>aps+=cpow*2},
  {id:'a8', icon:'🌌',name:'Nebulosa Generadora',  desc:'+800 energía/segundo',             cost:195000,t:'auto',  fn:()=>aps+=800},
  {id:'c8', icon:'👊',name:'Impacto Estelar',      desc:'+200 energía por clic',            cost:290000,t:'click', fn:()=>cpow+=200},
  {id:'cr4',icon:'💥',name:'Colapso Cuántico',     desc:'Críticos ×5 daño',                 cost:390000,t:'crit',  fn:()=>cmul=5},
  // ─ Tier 4 ─────────────────────────────
  {id:'m4', icon:'🚀',name:'Motor de Fusión',      desc:'×8 clic y producción automática',  cost:5e5,   t:'multi', fn:()=>{cpow*=8;aps*=8}},

  {id:'c9', icon:'🌟',name:'Clic Estelar',         desc:'×4 poder de clic',                 cost:9e5,   t:'click', fn:()=>cpow*=4},
  {id:'sp2',icon:'⚙️',name:'Clicker Avanzado',     desc:'Auto-genera clic×10 por segundo',  cost:1.2e6, t:'special',fn:()=>aps+=cpow*10},
  {id:'a10',icon:'🕳️',name:'Colector Agujero Negro',desc:'+5.000 energía/segundo',          cost:1.5e6, t:'auto',  fn:()=>aps+=5000},
  {id:'m5', icon:'🌠',name:'Tormenta Galáctica',   desc:'×10 clic y producción automática', cost:2e6,   t:'multi', fn:()=>{cpow*=10;aps*=10}},
  {id:'c10',icon:'🌪️',name:'Vórtice de Energía',  desc:'+1.000 energía por clic',          cost:3e6,   t:'click', fn:()=>cpow+=1000},
  {id:'cr5',icon:'🔴',name:'Ojo del Caos',         desc:'+20% crítico · críticos ×8',       cost:4e6,   t:'crit',  fn:()=>{crit+=.2;cmul=8}},
  {id:'a11',icon:'🌟',name:'Esfera de Dyson',      desc:'+15.000 energía/segundo',          cost:6e6,   t:'auto',  fn:()=>aps+=15000},
  {id:'m6', icon:'✨',name:'Núcleo Galáctico',     desc:'×15 clic y producción automática', cost:10e6,  t:'multi', fn:()=>{cpow*=15;aps*=15}},
  // ─ Tier 5 ─────────────────────────────
  {id:'c11',icon:'💠',name:'Clic Multidimensional',desc:'×5 poder de clic',                 cost:20e6,  t:'click', fn:()=>cpow*=5},
  {id:'a12',icon:'🌀',name:'Agujero de Gusano',    desc:'+50.000 energía/segundo',          cost:30e6,  t:'auto',  fn:()=>aps+=50000},
  {id:'sp3',icon:'🤖',name:'Enjambre de Clickers', desc:'Auto-genera clic×50 por segundo',  cost:50e6,  t:'special',fn:()=>aps+=cpow*50},
  {id:'m7', icon:'🔱',name:'Modo Universo',        desc:'×25 clic y producción automática', cost:80e6,  t:'multi', fn:()=>{cpow*=25;aps*=25}},
  {id:'a13',icon:'💥',name:'Motor del Big Bang',   desc:'+200.000 energía/segundo',         cost:150e6, t:'auto',  fn:()=>aps+=200000},
  {id:'c12',icon:'☄️',name:'Clic del Apocalipsis', desc:'+10.000 energía por clic',         cost:200e6, t:'click', fn:()=>cpow+=10000},
  {id:'cr6',icon:'🌈',name:'Arcoíris del Caos',    desc:'Críticos ×15 daño',                cost:300e6, t:'crit',  fn:()=>{cmul=15;crit+=.1}},
  {id:'m8', icon:'🌌',name:'Singularidad Cósmica', desc:'×50 clic y producción automática', cost:500e6, t:'multi', fn:()=>{cpow*=50;aps*=50}},
  // ─ Tier 6 · Endgame ───────────────────
  {id:'a14',icon:'🌠',name:'Red de Neutrones',     desc:'+1.000.000 energía/segundo',       cost:1e9,   t:'auto',  fn:()=>aps+=1e6},
  {id:'c13',icon:'🖖',name:'Toque del Creador',    desc:'×10 poder de clic',                cost:2e9,   t:'click', fn:()=>cpow*=10},
  {id:'m9', icon:'♾️',name:'Bucle Infinito',       desc:'×100 clic y producción automática',cost:5e9,  t:'multi', fn:()=>{cpow*=100;aps*=100}},
  {id:'sp4',icon:'🌐',name:'IA Cuántica',          desc:'Auto-genera clic×500 por segundo', cost:8e9,   t:'special',fn:()=>aps+=cpow*500},
  {id:'a15',icon:'💫',name:'Universo Comprimido',  desc:'+10.000.000 energía/segundo',      cost:15e9,  t:'auto',  fn:()=>aps+=10e6},
  {id:'m10',icon:'🏆',name:'OMEGA BOOST',          desc:'×1000 todo · 🎖️ FIN DEL JUEGO',  cost:100e9, t:'multi', fn:()=>{cpow*=1000;aps*=1000}},
];
const TC={click:'tc',auto:'ta',multi:'tm',crit:'tr',special:'ts'};
const TL={click:'Click',auto:'Auto',multi:'× Multi',crit:'Crítico',special:'Especial'};

// ══════════════════════════════════════════
//  FORMAT
// ══════════════════════════════════════════
function fmt(n){
  if(!isFinite(n)||n<0) return '0';
  const s=['','K','M','B','T','Qa','Qi','Sx'];
  let i=0; while(n>=1000&&i<s.length-1){n/=1000;i++;}
  return i===0?Math.floor(n).toString():n.toFixed(2)+s[i];
}

// ══════════════════════════════════════════
//  TAP  — usa pointerdown para evitar doble disparo touch+click
// ══════════════════════════════════════════
document.getElementById('owrap').addEventListener('pointerdown', tap, {passive:false});
let lastTapMs=0;
function tap(e){
  e.preventDefault();
  // debounce: ignora si han pasado menos de 80ms (previene doble disparo)
  const now=Date.now();
  if(now-lastTapMs<80) return;
  lastTapMs=now;
  const x=e.clientX||window.innerWidth/2, y=e.clientY||window.innerHeight/2;
  let g=cpow, isc=crit>0&&Math.random()<crit;
  if(isc) g=Math.floor(g*cmul);
  money+=g; total+=g;
  fxFloat(x,y,'+'+fmt(g),isc);
  fxParticles(x,y,isc);
  fxRipple(x,y);
  fxPulse();
}
function fxPulse(){const o=document.getElementById('orb');o.classList.add('tap');setTimeout(()=>o.classList.remove('tap'),95)}
function fxFloat(x,y,txt,crit){
  const el=document.createElement('div');
  el.className='flt';
  el.style.cssText=`left:${x+Math.random()*24-12}px;top:${y-8}px;font-size:${crit?23:15}px;color:${crit?'#ffd966':'#8ac8ff'};text-shadow:0 0 9px ${crit?'#ffd966':'#5ba3ff'};`;
  el.textContent=txt;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),960);
}
function fxParticles(x,y,crit){
  const cols=crit?['#ffd966','#ffaa30','#ff8']:['#5ba3ff','#b06fff','#3ff0ff'];
  const n=crit?10:5;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='ptc';
    const s=3+Math.random()*4,a=(Math.PI*2/n)*i+Math.random()*.5,d=22+Math.random()*44;
    el.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:${cols[i%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),750);
  }
}
function fxRipple(x,y){
  const el=document.createElement('div');el.className='rpl';
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),560);
}

// ══════════════════════════════════════════
//  BUY
// ══════════════════════════════════════════
function buy(id){
  const u=UPS.find(u=>u.id===id);
  if(!u||P[id]||money<u.cost) return;
  money-=u.cost; P[id]=true; bought++; delete NEW[id];
  u.fn();
  fxBuy(u.icon+' '+u.name, TC[u.t]);
  showToast('✅ '+u.name+' activado!');
  dirty=true;
}
function fxBuy(txt, tc){
  const el=document.createElement('div');
  el.className='pfx';
  const col={tc:'rgba(91,163,255,.2)',ta:'rgba(63,255,160,.2)',tm:'rgba(255,217,102,.2)',tr:'rgba(255,107,107,.2)',ts:'rgba(176,111,255,.2)'}[tc]||'rgba(91,163,255,.2)';
  const border={tc:'var(--blue)',ta:'var(--green)',tm:'var(--gold)',tr:'var(--red)',ts:'var(--purple)'}[tc]||'var(--blue)';
  const color={tc:'var(--blue)',ta:'var(--green)',tm:'var(--gold)',tr:'var(--red)',ts:'var(--purple)'}[tc]||'var(--blue)';
  el.style.cssText=`background:${col};border:2px solid ${border};color:${color};`;
  el.textContent=txt;
  document.body.appendChild(el);setTimeout(()=>el.remove(),560);
}

// ══════════════════════════════════════════
//  VISIBLE LOGIC
//  Aparece cuando tienes el 50% del coste en dinero actual,
//  o ya fue vista antes (knownVis), o ya está comprada.
// ══════════════════════════════════════════
function getVisible(){
  return UPS.filter(u=>P[u.id]||knownVis.has(u.id)||money>=u.cost*0.5);
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
let dirty=true;

function checkNewUnlocks(){
  let changed=false;
  for(const u of UPS){
    if(!knownVis.has(u.id)&&money>=u.cost*0.5){
      knownVis.add(u.id);
      NEW[u.id]=true;
      showToast('🔓 '+u.name+' disponible!');
      changed=true;
    }
  }
  if(changed) dirty=true;
}

// Full rebuild (only when dirty)
function renderList(){
  if(!dirty) return;
  dirty=false;
  const list=document.getElementById('ulist');
  const hint=document.getElementById('emptyhint');
  const vis=getVisible();

  hint.style.display=vis.length===0?'block':'none';
  list.innerHTML='';

  // pending sorted by cost asc, then bought
  const pending=vis.filter(u=>!P[u.id]).sort((a,b)=>a.cost-b.cost);
  const done=vis.filter(u=>P[u.id]);

  for(const u of [...pending,...done]){
    const b=!!P[u.id];
    const ok=!b&&money>=u.cost;
    const pct=b?100:Math.min(100,money/u.cost*100);
    const tc=TC[u.t];
    const el=document.createElement('div');
    el.className=`ucard ${tc}${b?' done':ok?' buy':''}`;
    el.dataset.id=u.id;
    el.innerHTML=`
      ${NEW[u.id]?'<div class="nbadge">nuevo</div>':''}
      <div class="uico">${u.icon}</div>
      <div class="ubody">
        <div class="uname">${u.name}</div>
        <div class="udesc">${u.desc}</div>
        <span class="upill">${TL[u.t]}</span>
        <div class="ubot">
          <div class="ubar"><div class="ubfill" style="width:${pct}%" data-bid="${u.id}"></div></div>
          <div class="ucost ${b?'cost-v':ok?'cost-ok':'cost-no'}" data-cid="${u.id}">
            ${b?'✓':'💰'+fmt(u.cost)}
          </div>
          <button class="ubtn" data-uid="${u.id}">Comprar</button>
        </div>
      </div>
    `;
    if(!b) el.onclick=(e)=>{
      // prevent double-fire from button click bubbling
      if(e.target.classList.contains('ubtn')) return;
      buy(u.id);
    };
    const btn=el.querySelector('.ubtn');
    if(btn) btn.onclick=(e)=>{e.stopPropagation();buy(u.id);};
    list.appendChild(el);
  }
  document.getElementById('ucnt').textContent=bought+' / '+UPS.length;
}

// Lightweight per-frame update: just sync progress + glow state
function lightUpdate(){
  const vis=getVisible().filter(u=>!P[u.id]);
  for(const u of vis){
    const pct=Math.min(100,money/u.cost*100);
    const fill=document.querySelector(`.ubfill[data-bid="${u.id}"]`);
    const cost=document.querySelector(`.ucost[data-cid="${u.id}"]`);
    const card=document.querySelector(`.ucard[data-id="${u.id}"]`);
    if(!card) continue;
    if(fill) fill.style.width=pct+'%';
    const ok=money>=u.cost;
    if(ok&&!card.classList.contains('buy')){
      card.classList.add('buy');
      if(cost){cost.className='ucost cost-ok';cost.textContent='💰'+fmt(u.cost);}
    } else if(!ok&&card.classList.contains('buy')){
      card.classList.remove('buy');
      if(cost){cost.className='ucost cost-no';cost.textContent='💰'+fmt(u.cost);}
    }
  }
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
let ttmr;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(ttmr);ttmr=setTimeout(()=>t.classList.remove('on'),2400);
}

// ══════════════════════════════════════════
//  TOP BAR UPDATE
// ══════════════════════════════════════════
function updateBar(){
  document.getElementById('bmoney').textContent=fmt(money);
  document.getElementById('bclick').textContent=fmt(cpow);
  document.getElementById('bauto').textContent=fmt(aps);
  document.getElementById('bbought').textContent=bought+'/'+UPS.length;
  document.getElementById('cpval').textContent=fmt(cpow);
}

// ══════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════
let lt=Date.now();
function loop(){
  const now=Date.now(),dt=Math.min((now-lt)/1000,.5);lt=now;
  if(aps>0){const g=aps*dt;money+=g;total+=g;}
  checkNewUnlocks();
  updateBar();
  renderList();
  lightUpdate();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════
function save(){
  localStorage.setItem('gc4',JSON.stringify({
    money,total,cpow,aps,crit,cmul,bought,
    p:Object.keys(P),kv:[...knownVis]
  }));
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem('gc4')||'null');
    if(!s||!s.p) return;
    money=s.money||0;total=s.total||0;cpow=s.cpow||1;
    aps=s.aps||0;crit=s.crit||0;cmul=s.cmul||2;bought=s.bought||0;
    s.p.forEach(id=>{P[id]=true;});
    (s.kv||[]).forEach(id=>knownVis.add(id));
  }catch(e){}
}

// ══════════════════════════════════════════
//  STARS BACKGROUND
// ══════════════════════════════════════════
(()=>{
  const bg=document.getElementById('bg');
  for(let i=0;i<65;i++){
    const el=document.createElement('div');el.className='sd';
    const s=(Math.random()*2+.5).toFixed(1);
    el.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--o:${(Math.random()*.45+.08).toFixed(2)};--d:${(Math.random()*3+2).toFixed(1)}s;--dl:${(Math.random()*5).toFixed(1)}s;`;
    bg.appendChild(el);
  }
})();

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
load();
setInterval(save,15000);
loop();
</script>
</body>
</html>
